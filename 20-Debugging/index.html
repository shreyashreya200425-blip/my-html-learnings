<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Donation Form</title>
</head>
<body>
  <h1>Donation Form</h1>
  <form>
    
    <label for="full-name">Full Name:</label>
    <input required id="full-name" type="text" name="name">

    <label for="email-address"> Email Address:</label>
    <input required id="email-address" type="email" name="email">

    <label for="donation-amount"> Donation Amount ($):</label>
    <input required id="donation-amount" type="number" name="amount">

    <label for="subscribe" > Subscribe </label>
    <input id="subscribe" type="checkbox" name="newsletter">

    <input type="submit" value="Send">
  </form>
</body>
</html>
