<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <header>
      <h1 id="title">Survey Form</h1>
      <p id="description">Thank you for taking the time to help us improve our services.</p>
    </header>

    <main>
      <form id="survey-form">
      <label id="name-label" for="name">Name</label>
      <input 
      required 
      type="text" 
      id="name" 
      name="name" 
      placeholder="e.g. Monica Geller" 
      size="20">
<br>
      <label id="email-label" for="email">Email</label>
      <input 
      required 
      type="email" 
      id="email" 
      name="email" 
      placeholder="e.g. abc@email.com" 
      size="20">
<br>
      <label id="number-label" for="number">Age</label>
      <input 
      required 
      type="number" 
      id="number" 
      name="age" 
      placeholder="e.g. 18" 
      min="18"
      max="99">
      
     <p>Which option best describes your current situation?</p>
      <select name="current-role" id="role-dropdown">
        <option value="employed">Employed</option>
        <option value="un-employed">Un-employed</option>
        <option value="student">Student</option>
        <option value="retired">Retired</option>
      </select>

      <p>Would you recommend this restaurant to your friends?</p>
      <input
      type="radio"
      id="yes-option"
      name="recommendation"
      value="yes">
      <label for="yes-option">Yes</label>

      <input 
      id="no-option"
      type="radio"
      name="recommendation"
      value="no">
      <label for="no-option" >No</label>

      <p>What is your favourite cuisine?</p>
      <select name="cuisine" id="cuisine-dropdown">
        <option value="italian">Italian</option>
        <option value="mexican">Mexican</option>
        <option value="chinese">Chinese</option>
        <option value="indian">Indian</option>
      </select>

      <p>What would you like to see improved? <i>(Check all that apply)</i></p>
      <label 
      for="sanitation"> Sanitation?</label>
      <input 
      value="Sanitation"
      type="checkbox"
      id="sanitation"
      name="options">
<br>
      <label 
      for="staff-behaviour"> Staff Behaviour?</label>
      <input 
      value="Staff Behaviour"
      type="checkbox"
      id="staff-behaviour"
      name="options">
<br>
      <label 
      for="food-quality"> Food Quality?</label>
      <input 
      value="Food Quality"
      type="checkbox"
      id="food-quality"
      name="options">
<br>
      <label 
      for="food-quantity"> Food Quantity?</label>
      <input 
      value="Food Quantity"
      type="checkbox"
      id="food-quantity"
      name="options">

      <p>Any suggestion?</p>
      <textarea
      cols="50"
      rows="10"
      name="comment"
      id="comment"></textarea>

      <button id="submit"
      type="submit">Submit</button>

      </form>
    </main>
  </body>
</html>
